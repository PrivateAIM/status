name: Scheduled Health Check

on:
  schedule:
    # Every 15 minutes, offset from quarter-hours to reduce queuing delays.
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health_check_job:
    runs-on: ubuntu-latest
    name: Run FLAME E2E Health Check
    environment: FLAME Health Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Health check logs live on the `data` branch, kept separate from
      # `main` so the bot's frequent commits don't spam the source history.
      - name: Checkout data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch

      - name: Restore logs from data branch
        run: |
          mkdir -p docs/logs
          cp data-branch/docs/logs/*.log docs/logs/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E Health Check
        id: health-check
        continue-on-error: true
        env:
          FLAME_USERNAME: ${{ secrets.FLAME_USERNAME }}
          FLAME_PASSWORD: ${{ secrets.FLAME_PASSWORD }}
        run: python flame_health_check.py

      - name: Update Discord status and send incident alerts
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_ROLE_ID: ${{ vars.DISCORD_ALERT_ROLE_ID }}
          DISCORD_ALERT_ROLE_IDS: ${{ vars.DISCORD_ALERT_ROLE_IDS }}
          DISCORD_ALERT_USER_IDS: ${{ vars.DISCORD_ALERT_USER_IDS }}
          DISCORD_STATUS_PAGE_URL: ${{ vars.DISCORD_STATUS_PAGE_URL }}
        run: python discord_notify.py --check-outcome "${{ steps.health-check.outcome }}"

      - name: Commit and Push log changes
        if: always()
        run: |
          mkdir -p data-branch/docs/logs
          for log in docs/logs/*.log; do
            if [ -f "$log" ]; then
              cp "$log" data-branch/docs/logs/
            fi
          done
          cd data-branch
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/logs/
          if [ -f discord/state.json ]; then
            git add discord/state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "[Automated] Update E2E Health Check Logs"
            git pull --rebase origin data
            git push
          else
            echo "No changes in logs to commit."
          fi
