name: Scheduled Health Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health_check_job:
    runs-on: ubuntu-latest
    name: Run FLAME E2E Health Check
    environment: FLAME Health Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E Health Check
        continue-on-error: true
        env:
          FLAME_USERNAME: ${{ secrets.FLAME_USERNAME }}
          FLAME_PASSWORD: ${{ secrets.FLAME_PASSWORD }}
        run: python flame_health_check.py

      - name: Commit and Push log changes
        if: always()
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/logs/
          if ! git diff --cached --quiet; then
            git commit -m "[Automated] Update E2E Health Check Logs"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "No changes in logs to commit."
          fi
